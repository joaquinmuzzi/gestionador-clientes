name: Tests

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository
permissions:
  contents: read

# A new push to the same branch cancels the previous run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run the tests
        run: npm test

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gestionador
          POSTGRES_PASSWORD: gestionador
          POSTGRES_DB: gestionador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestionador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gestionador:gestionador@localhost:5432/gestionador

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # A throwaway key for this run only
      - name: Generate an encryption key
        run: echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Apply the migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
